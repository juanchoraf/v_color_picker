[package]
name = "v_color_picker"
version = "0.1.1"
edition = "2024"
description = "Fast cross-platform desktop color picker for exact screen colors and CSS color formats."
authors = ["TheVelasquez.com"]
license = "MIT"
homepage = "https://thevelasquez.com"

[dependencies]
anyhow = "1.0.104"
arboard = { version = "3.6.1", features = ["wayland-data-control"] }
eframe = { version = "0.36.1", default-features = false, features = ["accesskit", "default_fonts", "glow", "persistence", "wayland", "x11"] }
image = { version = "0.25.10", default-features = false, features = ["png"] }
semver = "1.0.28"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
ureq = { version = "3.4.0", features = ["json"] }
winit = { version = "0.30.13", default-features = false, features = ["wayland-csd-adwaita", "wayland-dlopen"] }
xcap = "0.9.8"

[patch.crates-io]
xcap = { path = "vendor/xcap" }

[profile.release]
codegen-units = 1
lto = "thin"
opt-level = 3
panic = "abort"
strip = "symbols"
